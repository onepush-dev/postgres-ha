global
    maxconn "${HAPROXY_MAXCONN}"
    log stdout format raw local0 info

resolvers railway
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold other      5s
    hold refused    5s
    hold nx         5s
    hold timeout    5s
    hold obsolete   5s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    retries 2
    timeout connect 5s
    timeout client "${HAPROXY_TIMEOUT_CLIENT}"
    timeout server "${HAPROXY_TIMEOUT_SERVER}"
    timeout check 3s

# Railway healthcheck + monitoring
frontend health
    mode http
    bind :::8080 v4v6
    monitor-uri /health
    http-request return status 200 content-type text/plain lf-string "primary_up=%[nbsrv(primary)] replicas_up=%[nbsrv(replicas)]\n" if { path /status }

frontend read_write
    bind :::5432 v4v6
    default_backend primary

frontend read_only
    bind :::5433 v4v6
    # replicas when any is healthy, otherwise fall back to the primary
    use_backend replicas if { nbsrv(replicas) gt 0 }
    default_backend primary

backend primary
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 1s fastinter 500ms downinter 1s rise 2 fall 2 on-marked-down shutdown-sessions check port 8008 resolvers railway resolve-prefer ipv6 init-addr none
    server node1 "${NODE_1_HOST}:5432"
    server node2 "${NODE_2_HOST}:5432"
    server node3 "${NODE_3_HOST}:5432"

backend replicas
    balance leastconn
    option httpchk
    http-check send meth GET uri "/replica?lag=${HAPROXY_REPLICA_MAX_LAG}"
    http-check expect status 200
    default-server inter 2s fastinter 500ms downinter 1s rise 2 fall 2 on-marked-down shutdown-sessions check port 8008 resolvers railway resolve-prefer ipv6 init-addr none
    server node1 "${NODE_1_HOST}:5432"
    server node2 "${NODE_2_HOST}:5432"
    server node3 "${NODE_3_HOST}:5432"
